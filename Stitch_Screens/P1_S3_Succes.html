<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Premium EaseOutExpo Animation */
        @keyframes dynamicIslandSuccess {
            0% {
                transform: translate(-50%, -100%) scale(0.9);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, 0) scale(1.05);
                opacity: 1;
            }
            30% {
                transform: translate(-50%, 0) scale(1);
                opacity: 1;
            }
            85% {
                transform: translate(-50%, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -120%) scale(0.95);
                opacity: 0;
            }
        }

        .animate-island {
            animation: dynamicIslandSuccess 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDownOut {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(100%);
            }
        }

        .animate-slide-down-out {
            animation: slideDownOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Blur background host app */
        .host-app-bg {
            background-color: #f2fbfc; /* surface */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(197, 220, 254, 0.4), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(219, 225, 255, 0.4), transparent 25%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden font-body-md antialiased host-app-bg selection:bg-primary-container selection:text-on-primary-container relative">

<div class="absolute inset-0 p-container-margin-mobile flex flex-col pt-24 opacity-60">

<div class="h-32 bg-white/40 backdrop-blur-md rounded-xl border border-white/20 shadow-sm"></div>
<div class="col-span-2 h-48 bg-white/40 backdrop-blur-md rounded-xl border border-white/20 shadow-sm mt-gutter"></div>
</div>
</div>
<!-- Dynamic Island Success Notification -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 z-[100] animate-island">
<div class="bg-[#0E2F76] text-[#F5FEFF] px-6 py-3 rounded-full shadow-[0_12px_32px_rgba(14,47,118,0.2)] flex items-center gap-3 backdrop-blur-xl border border-white/10">
<span class="material-symbols-outlined text-[#00dfc2] text-[20px]" data-icon="check_circle" data-weight="fill">check_circle</span>
<span class="font-label-md text-[#F5FEFF]">Envoyé</span>
</div>
</div>
<!-- Dismissing Bottom Sheet -->
<div class="fixed bottom-0 left-0 w-full z-40 animate-slide-down-out bg-surface/80 backdrop-blur-2xl rounded-t-xl border-t border-white/20 shadow-[0_-12px_32px_rgba(14,47,118,0.12)] p-container-margin-mobile pb-12 flex flex-col items-center justify-center h-64">
<!-- Sheet Handle -->
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full mb-8"></div>
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check" data-weight="fill">check</span>
</div>
<h2 class="font-title-lg text-title-lg text-primary mb-2">Transfert terminé</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Fermeture en cours...</p>
