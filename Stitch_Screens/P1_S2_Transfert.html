<style>
        .bottom-sheet-enter {
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background min-h-screen relative font-body-md text-on-background overflow-hidden antialiased">
<!-- Mock Background App Content (Blurred) -->
<div class="absolute inset-0 z-0">
<!-- Top App Bar Mock -->
<header class="bg-surface/60 backdrop-blur-xl border-b border-white/20 shadow-sm flex items-center justify-between px-container-margin-mobile h-16 fixed top-0 w-full z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-primary">MG Drop</h1>
</div>
<div class="w-8 h-8 rounded-full bg-secondary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small, circular avatar portrait of a professional in a modern, light-filled office. The lighting is soft and natural, emphasizing a clean, contemporary aesthetic consistent with a premium corporate application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC85yM2v4TdS4uWSuHQW6Pz1U20R7ELxt8FtSH9bAVM-gfPLStK2o6nC4ibWCfbJ0ABnSz75Bnc5EIOJIrkypuavRk3soqOjie1_Y4LNUne-wZQYi0hEXDxafSoS-jlbeqj4sBj-aFmRH3sjL4yFRe_FEfsUZ07-qDtoslf6VTCMoChETKCT-EfwHzrAa2hMf5KkGWTu-wPRfZbIVNen3oYza8QMeznGK8UFY2mOlnIs-TLdXY5Luwdrg"/>
</div>
</header>
<!-- Main Content Area Mock -->
<main class="pt-24 px-container-margin-mobile pb-32 grid grid-cols-2 md:grid-cols-4 gap-gutter filter blur-md opacity-60">
<!-- Mock File Cards -->
<div class="col-span-2 bg-white/60 backdrop-blur-[20px] border border-white/20 rounded-lg p-4 shadow-sm h-32"></div>
<div class="col-span-2 bg-white/60 backdrop-blur-[20px] border border-white/20 rounded-lg p-4 shadow-sm h-32"></div>
<div class="col-span-full bg-white/60 backdrop-blur-[20px] border border-white/20 rounded-lg p-4 shadow-sm h-48 mt-section-gap"></div>
<div class="col-span-2 bg-white/60 backdrop-blur-[20px] border border-white/20 rounded-lg p-4 shadow-sm h-32 mt-section-gap"></div>
<div class="col-span-2 bg-white/60 backdrop-blur-[20px] border border-white/20 rounded-lg p-4 shadow-sm h-32 mt-section-gap"></div>
</main>
<!-- Bottom Nav Bar Mock -->
<nav class="bg-surface/80 backdrop-blur-2xl border-t border-white/20 shadow-[0_-12px_32px_rgba(14,47,118,0.12)] fixed bottom-0 w-full rounded-t-xl z-10 flex justify-around items-center px-4 py-3 pb-8">
<div class="flex flex-col items-center justify-center bg-secondary-container text-primary rounded-full px-6 py-2">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">swap_horizontal_circle</span>
<span class="font-label-sm text-label-sm mt-1">Transfer</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">folder_open</span>
<span class="font-label-sm text-label-sm mt-1">Files</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-sm text-label-sm mt-1">Activity</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
<span class="font-label-sm text-label-sm mt-1">Vault</span>
</div>
</nav>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-40 bg-on-background/20 backdrop-blur-[30px] transition-opacity duration-300"></div>

<div class="fixed bottom-0 left-0 w-full z-50 bottom-sheet-enter px-4 pb-6">
<div class="bg-[#F5FEFF] rounded-[30px] shadow-[0_12px_32px_rgba(14,47,118,0.12)] border border-white/40 p-8 flex flex-col items-center justify-center relative overflow-hidden max-w-md mx-auto">

<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full absolute top-4 left-1/2 -translate-x-1/2"></div>

<div class="w-full flex justify-between items-center mb-8 mt-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary">description</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">Sending to</p>
<p class="font-title-lg text-title-lg text-on-surface">Design Team</p>
</div>
</div>
<button class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant hover:bg-surface-dim transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Progress Gauge -->
<div class="relative w-48 h-48 flex items-center justify-center mb-6">
<svg class="w-full h-full absolute inset-0" viewbox="0 0 120 120">
<!-- Background Circle -->
<circle cx="60" cy="60" fill="none" r="54" stroke="#e6f0f1" stroke-width="6"></circle>
<!-- Progress Circle -->
<circle class="progress-ring__circle" cx="60" cy="60" fill="none" r="54" stroke="#AAC0E1" stroke-dasharray="339.292" stroke-dashoffset="186.61" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Central Value -->
<span class="font-display-md text-display-md text-primary font-bold">45%</span>
</div>
<!-- Status Text -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-[#0E2F76] mb-2">Envoi en cours...</h2>
<!-- File Info Pill -->
<div class="bg-surface-variant/50 border border-white/30 rounded-full px-4 py-2 mt-4 flex items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant">Q3_Assets_v2.zip</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-label-md text-label-md text-on-surface-variant">1.2 GB / 2.8 GB</span>
</div>
<!-- Cancel Button -->
<button class="mt-8 px-8 py-3 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors">
                Annuler
            </button>
